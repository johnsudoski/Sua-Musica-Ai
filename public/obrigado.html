<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra confirmada! 🎵 — SuaMúsicaAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #E91E8C;
      --purple: #7B2FBE;
      --bg: #0D0D1A;
      --card: #161628;
      --border: #2a2a45;
      --text: #e2e2f0;
      --muted: #888;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      padding: 36px 32px;
      text-align: center;
    }
    .header .icon {
      font-size: 52px;
      display: block;
      margin-bottom: 12px;
    }
    .header h1 { font-size: 24px; color: #fff; font-weight: 700; }
    .header p  { margin-top: 6px; color: rgba(255,255,255,0.85); font-size: 15px; }

    .body { padding: 32px; }

    /* ── Waveform animado ── */
    .wave-box {
      background: rgba(233, 30, 140, 0.08);
      border: 1px solid rgba(233, 30, 140, 0.25);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 28px;
      transition: background 0.4s, border-color 0.4s;
    }
    .wave-box.ready {
      background: rgba(34, 197, 94, 0.08);
      border-color: rgba(34, 197, 94, 0.3);
    }
    .wave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 14px;
    }
    .wave span {
      display: block;
      width: 4px;
      background: var(--pink);
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite;
    }
    .wave span:nth-child(1) { height: 10px; animation-delay: 0.0s; }
    .wave span:nth-child(2) { height: 20px; animation-delay: 0.1s; }
    .wave span:nth-child(3) { height: 30px; animation-delay: 0.2s; }
    .wave span:nth-child(4) { height: 20px; animation-delay: 0.3s; }
    .wave span:nth-child(5) { height: 10px; animation-delay: 0.4s; }
    .wave span:nth-child(6) { height: 20px; animation-delay: 0.1s; }
    .wave span:nth-child(7) { height: 30px; animation-delay: 0.2s; }
    .wave span:nth-child(8) { height: 20px; animation-delay: 0.3s; }
    .wave span:nth-child(9) { height: 10px; animation-delay: 0.4s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .wave-box.ready .wave span { background: #22c55e; animation: none; transform: scaleY(1); opacity: 1; }

    #status-text { font-size: 15px; color: var(--text); font-weight: 600; }
    #time-hint   { font-size: 13px; color: var(--muted); margin-top: 6px; }

    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    label {
      display: block;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="email"] {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus { border-color: var(--pink); }
    input[type="email"]::placeholder { color: #555; }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      margin-top: 12px;
      transition: opacity 0.2s, transform 0.1s;
      text-align: center;
      text-decoration: none;
      color: #fff;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-check    { background: linear-gradient(135deg, var(--pink), var(--purple)); }
    .btn-mp3      { background: #22c55e; font-size: 17px; }
    .btn-video    { background: var(--purple); border: 1px solid var(--pink); margin-top: 8px; }
    .btn-resend   { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 13px; }

    .feedback {
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
    }
    .feedback.ok  { color: #22c55e; }
    .feedback.err { color: #f87171; }

    #download-section { display: none; margin-top: 4px; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      padding: 20px 32px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .footer p   { font-size: 13px; color: var(--muted); }
    .footer a   { color: var(--pink); text-decoration: none; }
    .footer + p { margin-top: 8px; }
  </style>
</head>
<body>

<div class="card">

  <!-- ── Header ── -->
  <div class="header">
    <span class="icon">🎵</span>
    <h1>Compra confirmada!</h1>
    <p>Sua música personalizada está sendo criada 💕</p>
  </div>

  <div class="body">

    <!-- Waveform / status -->
    <div class="wave-box" id="wave-box">
      <div class="wave">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <p id="status-text">Gerando sua música com IA...</p>
      <p id="time-hint">Isso leva de 3 a 5 minutos. Você receberá o link no email!</p>
    </div>

    <!-- Botões de download (ocultos até estar pronto) -->
    <div id="download-section">
      <a class="btn btn-mp3" id="btn-mp3" href="#" target="_blank">⬇️ Baixar minha música (MP3)</a>
      <a class="btn btn-video" id="btn-video" href="#" target="_blank" style="display:none;">🎬 Baixar Vídeo com Letra (MP4)</a>
    </div>

    <hr>

    <!-- Verificação por email -->
    <div id="email-section">
      <label for="email-input">Digite seu email para verificar o status e baixar direto aqui:</label>
      <input type="email" id="email-input" placeholder="seu@email.com" autocomplete="email">
      <button class="btn btn-check" id="btn-check" onclick="checkStatus()">
        Ver meu download
      </button>
      <p class="feedback" id="feedback"></p>
    </div>

    <!-- Reenviar email (aparece após download pronto) -->
    <div id="resend-section" style="display:none; margin-top:16px;">
      <button class="btn btn-resend" onclick="resendEmail()">
        📧 Reenviar email com o link
      </button>
      <p class="feedback" id="resend-feedback"></p>
    </div>

  </div>

  <div class="footer">
    <p>Dúvidas? Fale com a gente: <a href="mailto:suporte@suamusicaai.com.br">suporte@suamusicaai.com.br</a></p>
    <p style="margin-top:8px;"><a href="/">← Criar outra música</a></p>
  </div>

</div>

<script>
const BASE = window.location.origin;
let _emailUsado = '';

async function checkStatus() {
  const email = document.getElementById('email-input').value.trim();
  if (!email) { setFeedback('Informe seu email.', 'err'); return; }
  _emailUsado = email;

  const btn = document.getElementById('btn-check');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Verificando...';
  setFeedback('', '');

  try {
    const r = await fetch(`${BASE}/api/delivery-status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const d = await r.json();

    if (d.status === 'ready') {
      mostrarDownload(d);
    } else if (d.status === 'generating') {
      const nome = d.nomeDestinatario ? ` para <strong>${d.nomeDestinatario}</strong>` : '';
      setFeedback(`Sua música${nome} ainda está sendo criada! Aguarde 2 minutos e tente de novo.`, 'ok');
    } else if (d.status === 'not_found') {
      setFeedback('Email não encontrado. Confira se digitou corretamente ou aguarde o email de confirmação.', 'err');
    } else {
      setFeedback('Houve um problema. Entre em contato com o suporte.', 'err');
    }
  } catch {
    setFeedback('Erro de conexão. Tente novamente.', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ver meu download';
  }
}

function mostrarDownload(d) {
  // Atualiza waveform
  const box = document.getElementById('wave-box');
  box.classList.add('ready');
  document.getElementById('status-text').textContent =
    '🎉 Música pronta' + (d.nomeDestinatario ? ` para ${d.nomeDestinatario}!` : '!');
  document.getElementById('time-hint').textContent =
    'Clique para baixar. O link também foi enviado para seu email.';

  // Botões de download
  document.getElementById('btn-mp3').href = `${BASE}/api/download/${d.downloadToken}`;
  if (d.videoToken) {
    const bv = document.getElementById('btn-video');
    bv.href = `${BASE}/api/download/${d.videoToken}`;
    bv.style.display = 'block';
  }
  document.getElementById('download-section').style.display = 'block';

  // Esconde seção de email, mostra reenvio
  document.getElementById('email-section').style.display = 'none';
  document.getElementById('resend-section').style.display = 'block';
  setFeedback('', '');
}

async function resendEmail() {
  if (!_emailUsado) return;
  const btn = document.querySelector('#resend-section .btn-resend');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Enviando...';

  try {
    const r = await fetch(`${BASE}/api/resend-email`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: _emailUsado }),
    });
    const d = await r.json();
    const fb = document.getElementById('resend-feedback');
    if (d.success) {
      fb.textContent = '✅ Email reenviado! Verifique sua caixa de entrada.';
      fb.className = 'feedback ok';
    } else {
      fb.textContent = d.message || d.error || 'Erro ao reenviar.';
      fb.className = 'feedback err';
    }
  } catch {
    document.getElementById('resend-feedback').textContent = 'Erro. Tente novamente.';
    document.getElementById('resend-feedback').className = 'feedback err';
  } finally {
    btn.disabled = false;
    btn.textContent = '📧 Reenviar email com o link';
  }
}

function setFeedback(msg, type) {
  const el = document.getElementById('feedback');
  el.innerHTML = msg;
  el.className = `feedback ${type}`;
}

document.getElementById('email-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkStatus();
});
</script>
</body>
</html>
