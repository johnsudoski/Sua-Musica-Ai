<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avalie sua música — SuaMúsicaAI</title>
  <meta name="robots" content="noindex, nofollow" />
  <!-- Microsoft Clarity -->
  <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xm2zpgivms");
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D0D1A; color: #e2e2f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 440px;
      background: #161628; border: 1px solid #2a2a45; border-radius: 20px;
      padding: 32px 28px; text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #a09bb8; margin-bottom: 24px; }
    .stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .star {
      font-size: 40px; cursor: pointer; color: #333; transition: color 0.15s, transform 0.1s;
      user-select: none;
    }
    .star.active { color: #fbbf24; transform: scale(1.1); }
    textarea {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #2a2a45;
      border-radius: 12px; padding: 14px; color: #fff; font-size: 14px; font-family: inherit;
      resize: vertical; min-height: 90px; margin-bottom: 16px;
    }
    textarea::placeholder { color: #666; }
    .btn {
      display: block; width: 100%; padding: 15px; border-radius: 50px;
      font-size: 16px; font-weight: 700; border: none; cursor: pointer; color: #fff;
      background: linear-gradient(135deg, #E91E8C, #7B2FBE);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback { margin-top: 16px; font-size: 14px; }
    .feedback.ok { color: #22c55e; }
    .feedback.err { color: #f87171; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div id="form-section">
    <h1>Como foi sua experiência? 💕</h1>
    <p class="sub">Sua opinião ajuda outras pessoas a confiarem na SuaMúsicaAI</p>

    <div class="stars" id="stars">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>

    <textarea id="texto" placeholder="Conte como foi (opcional)... Ex: 'Ela chorou quando ouviu o nome dela na música!'"></textarea>

    <button class="btn" id="btnEnviar" disabled>Enviar avaliação</button>
    <p class="feedback" id="feedback"></p>
  </div>

  <div id="success-section" class="hidden">
    <h1>🥹 Obrigado!</h1>
    <p class="sub">Sua avaliação foi enviada. Ela significa muito pra gente.</p>
  </div>
</div>

<script>
const BASE = window.location.origin;
const token = new URLSearchParams(window.location.search).get('token');
let rating = 0;

const stars = document.querySelectorAll('.star');
stars.forEach(s => {
  s.addEventListener('click', () => {
    rating = Number(s.dataset.value);
    stars.forEach(x => x.classList.toggle('active', Number(x.dataset.value) <= rating));
    document.getElementById('btnEnviar').disabled = false;
  });
});

document.getElementById('btnEnviar').addEventListener('click', async () => {
  const fb = document.getElementById('feedback');
  const btn = document.getElementById('btnEnviar');
  if (!token) { fb.textContent = 'Link inválido.'; fb.className = 'feedback err'; return; }
  if (!rating) return;

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const r = await fetch(`${BASE}/api/reviews`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, rating, texto: document.getElementById('texto').value }),
    });
    const d = await r.json();
    if (d.success) {
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('success-section').classList.remove('hidden');
    } else {
      fb.textContent = d.error || 'Erro ao enviar.';
      fb.className = 'feedback err';
      btn.disabled = false;
      btn.textContent = 'Enviar avaliação';
    }
  } catch {
    fb.textContent = 'Erro de conexão. Tente novamente.';
    fb.className = 'feedback err';
    btn.disabled = false;
    btn.textContent = 'Enviar avaliação';
  }
});
</script>
</body>
</html>
